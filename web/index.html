<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Molbhav — a voice-first expense tracker. Har kharch ka mol.">
  <meta name="theme-color" content="#0B0D12">

  <!-- iOS / PWA meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Molbhav">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Molbhav</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #0B0D12; }
    #splash {
      position: fixed; inset: 0; display: flex; align-items: center;
      justify-content: center; background: #0B0D12; z-index: 1;
    }
    #splash img {
      width: 92px; height: 92px; border-radius: 24px;
      box-shadow: 0 12px 40px rgba(242,162,12,.28);
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: .65; transform: scale(.95); }
      50% { opacity: 1; transform: scale(1); }
    }
    /* Install banner */
    #installBar {
      position: fixed; left: 12px; right: 12px; top: 12px; z-index: 10000;
      display: none; align-items: center; gap: 10px;
      background: #141822; color: #F3EFE6;
      border: 1px solid rgba(255,255,255,.12); border-radius: 14px;
      padding: 10px 12px; box-shadow: 0 10px 30px rgba(0,0,0,.45);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
    #installBar img { width: 34px; height: 34px; border-radius: 9px; }
    #installBar .txt { flex: 1; font-size: 13px; line-height: 1.35; }
    #installBar .txt b { color: #FFC24A; }
    #installBar button {
      border: none; border-radius: 999px; font-family: inherit;
      font-weight: 700; font-size: 13px; cursor: pointer;
    }
    #installGo { background: #F2A20C; color: #12233F; padding: 8px 16px; }
    #installClose { background: transparent; color: #98A0B0; padding: 6px 8px; font-size: 15px; }
  </style>
</head>
<body>
  <div id="splash"><img src="icons/Icon-192.png" alt="Molbhav"></div>

  <div id="installBar">
    <img src="icons/Icon-192.png" alt="">
    <div class="txt" id="installText">Install Molbhav for a full-screen app.</div>
    <button id="installGo">Install</button>
    <button id="installClose" aria-label="Dismiss">✕</button>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (s) s.remove();
    });

    // ---- PWA install helper ----
    (function () {
      var bar = document.getElementById('installBar');
      var go = document.getElementById('installGo');
      var closeBtn = document.getElementById('installClose');
      var text = document.getElementById('installText');
      var deferred = null;

      var standalone = window.matchMedia('(display-mode: standalone)').matches
        || window.navigator.standalone === true;
      if (standalone || localStorage.getItem('molbhav_install_dismissed')) return;

      var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);

      // Android / desktop Chrome & Edge: real one-tap install.
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        deferred = e;
        text.innerHTML = 'Install Molbhav for a full-screen app.';
        go.style.display = 'inline-block';
        bar.style.display = 'flex';
      });
      go.addEventListener('click', async function () {
        if (!deferred) return;
        bar.style.display = 'none';
        deferred.prompt();
        try { await deferred.userChoice; } catch (_) {}
        deferred = null;
      });
      closeBtn.addEventListener('click', function () {
        bar.style.display = 'none';
        localStorage.setItem('molbhav_install_dismissed', '1');
      });
      window.addEventListener('appinstalled', function () {
        bar.style.display = 'none';
      });

      // iOS Safari has no install prompt — show the manual step.
      if (isIOS) {
        setTimeout(function () {
          go.style.display = 'none';
          text.innerHTML = 'To install: tap <b>Share</b>, then <b>Add to Home Screen</b>.';
          bar.style.display = 'flex';
        }, 2500);
      }
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
